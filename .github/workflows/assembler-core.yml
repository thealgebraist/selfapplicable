name: assembler-core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build host compiler
        run: g++ -std=c++23 -Wall -Wextra -pedantic -O2 c_subset_compiler.cpp -o c_subset_compiler-ci

      - name: Assemble and run control-flow fixtures
        shell: bash
        run: |
          set -euo pipefail
          for fixture in loop_break.c loop_continue.c loop_break_continue.c loop_break_then_continue.c; do
            ./c_subset_compiler-ci "fixtures/$fixture" > "$fixture.s"
            as --64 "$fixture.s" -o "$fixture.o"
            ld "$fixture.o" -o "$fixture.bin"
            case "$fixture" in
              loop_break.c) expected=XX ;;
              loop_continue.c) expected=XXXX ;;
              loop_break_continue.c) expected=XXX ;;
              loop_break_then_continue.c) expected=XX ;;
            esac
            actual=$(timeout 5 "./$fixture.bin")
            test "$actual" = "$expected"
          done

      - name: Check semantic tooling entry point
        run: ./check_semantics.sh

      - name: Compile Coq semantics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq coq
          coqc -q semantics.v

      - name: Assemble and run switch fixtures
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [switch_return.c]=7
            [switch_two_cases.c]=7
            [switch_three_cases.c]=11
            [switch_four_cases.c]=11
            [switch_five_cases.c]=11
            [enum_switch.c]=7
            [enum_switch_implicit.c]=8
          )
          for fixture in "${!expected[@]}"; do
            ./c_subset_compiler-ci "fixtures/$fixture" > "$fixture.s"
            as --64 "$fixture.s" -o "$fixture.o"
            ld "$fixture.o" -o "$fixture.bin"
            set +e
            timeout 5 "./$fixture.bin"
            actual=$?
            set -e
            test "$actual" -eq "${expected[$fixture]}"
          done

      - name: Assemble and run typed C-subset fixtures
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [function_call.c]=7
            [struct_field_return.c]=7
            [struct_arrow_return.c]=8
            [struct_next_return.c]=12
            [pointer_array_assign.c]=16
            [pointer_add_deref.c]=17
            [struct_sizeof_return.c]=12
            [recursive_base_case.c]=0
          )
          for fixture in "${!expected[@]}"; do
            ./c_subset_compiler-ci "fixtures/$fixture" > "$fixture.s"
            as --64 "$fixture.s" -o "$fixture.o"
            ld "$fixture.o" -o "$fixture.bin"
            set +e
            timeout 5 "./$fixture.bin"
            actual=$?
            set -e
            test "$actual" -eq "${expected[$fixture]}"
          done

      - name: Build and verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          ./make_release_bundle.sh "ci-${GITHUB_SHA}" ci-dist
          ./verify_release_bundle.sh "ci-dist/selfapplicable-ci-${GITHUB_SHA}.tar.gz"
